spring:
    application:
        name: api-gateway

    cloud:
        gateway:
            routes:
                - id: student-service
                  uri: http://localhost:8081
                  predicates:
                      - Path=/api/v1/students/**, /api/v1/student-groups/**, /api/v1/courses/**, /api/v1/specialties/**, /api/v1/auth/**, /student-openapi/**
                  filters: []

                - id: attendance-service
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/attendances/**, /attendance-openapi/**
                  filters: []

                - id: grade-service
                  uri: http://localhost:8083
                  predicates:
                      - Path=/api/v1/grades/**, /grade-openapi/**
                  filters: []

                - id: risk-prediction-service
                  uri: http://localhost:8084
                  predicates:
                      - Path=/api/v1/risks/**, /risk-openapi/**
                  filters: []

                - id: notification-service
                  uri: http://localhost:8085
                  predicates:
                      - Path=/api/v1/notifications/**, /notification-openapi/**
                  filters: []

            globalcors:
                cors-configurations:
                    '[/**]':
                        allowedOriginPatterns: "*"
                        allowedMethods: "*"
                        allowedHeaders: "*"
                        allowCredentials: true
                        exposedHeaders: "*"

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8090/realms/diploma-realm
                    jwk-set-uri: http://localhost:8090/realms/diploma-realm/protocol/openid-connect/certs

server:
    port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 01. Student Service
        url: http://localhost:8080/student-openapi/v3/api-docs
      - name: 02. Attendance Service
        url: /attendance-openapi/v3/api-docs
      - name: 03. Grade Service
        url: /grade-openapi/v3/api-docs
      - name: 04. Risk Prediction Service
        url: /risk-openapi/v3/api-docs
      - name: 05. Notification Service
        url: /notification-openapi/v3/api-docs

logging:
    level:
        org.springframework.cloud.gateway: DEBUG
