spring:
    application:
        name: api-gateway

    cloud:
        gateway:
            routes:
                - id: student-service
                  uri: http://localhost:8081
                  predicates:
                      - Path=/api/v1/students/**
                  filters:
                      - StripPrefix=1

                - id: attendance-service
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/v1/attendances/**
                  filters:
                      - StripPrefix=1

                - id: grade-service
                  uri: http://localhost:8083
                  predicates:
                      - Path=/api/v1/grades/**
                  filters:
                      - StripPrefix=1

                - id: risk-prediction-service
                  uri: http://localhost:8084
                  predicates:
                      - Path=/api/v1/risks/**
                  filters:
                      - StripPrefix=1

                - id: notification-service
                  uri: http://localhost:8085
                  predicates:
                      - Path=/api/v1/notifications/**
                  filters:
                      - StripPrefix=1

            globalcors:
                cors-configurations:
                    '[/**]':
                        allowedOrigins: "*"
                        allowedMethods:
                            - GET
                            - POST
                            - PUT
                            - DELETE
                            - OPTIONS
                        allowedHeaders: "*"
                        allowCredentials: true

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8090/realms/diploma-realm
                    jwk-set-uri: http://localhost:8090/realms/diploma-realm/protocol/openid-connect/certs

server:
    port: 8080

logging:
    level:
        org.springframework.cloud.gateway: DEBUG
