springdoc:
  api-docs:
    path: /grade-openapi/v3/api-docs
    resolve-server-url: true

spring:
    application:
        name: grade

    datasource:
        url: jdbc:postgresql://localhost:5434/grade_db
        username: grade_user
        password: testSecret!
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true

    liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8090/realms/diploma-realm
                    jwk-set-uri: http://localhost:8090/realms/diploma-realm/protocol/openid-connect/certs

    kafka:
        bootstrap-servers: localhost:9092
        consumer:
            group-id: grade-service-group
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            properties:
                spring.json.trusted.packages: "*"
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    grpc:
        server:
            port: 9083

server:
    port: 8083
    forward-headers-strategy: framework
