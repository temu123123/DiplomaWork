springdoc:
  api-docs:
    path: /risk-openapi/v3/api-docs
    resolve-server-url: true

spring:
    application:
        name: risk-prediction

    datasource:
        url: jdbc:postgresql://localhost:5435/risk_db
        username: risk_user
        password: testSecret!
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true

    liquibase:
        change-log: classpath:db/changelog/db.changelog-master.xml

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8090/realms/diploma-realm
                    jwk-set-uri: http://localhost:8090/realms/diploma-realm/protocol/openid-connect/certs

    data:
        mongodb:
            uri: mongodb://mongo_user:testSecret!@localhost:27017/risk_history_db?authSource=admin

    kafka:
        bootstrap-servers: localhost:9092
        consumer:
            group-id: risk-prediction-service-group
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
            properties:
                spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
                spring.json.use.type.headers: false
                spring.json.value.default.type: java.util.HashMap
                spring.json.trusted.packages: "*"
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    grpc:
        server:
            port: 9084
        client:
            attendance-service:
                address: 'static://localhost:9082'
            grade-service:
                address: 'static://localhost:9083'

server:
    port: 8084
    forward-headers-strategy: framework
